name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The unit and integration suites, and the coverage stages, run as one pool of tests per
# job (tests/run.sh, scripts/coverage.sh). A GitHub runner has 4 vCPUs; said here rather
# than read from lscpu, whose core count on a runner VM is not a measured thing.
env:
  AGENT_SANDBOX_TEST_JOBS: 4
  COVERAGE_JOBS: 4

jobs:
  # Lint, format, the Python components, install.sh in sync with its sources, the
  # installer's dry run -- scripts/check.sh, which is what a contributor runs locally,
  # without its test suites: CI runs those as the shards below.
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: mamba-org/setup-micromamba@v3
        with:
          environment-file: environment.yml
          cache-environment: true
      - name: scripts/check.sh (lint, shfmt, bundle-sync, dry-run)
        env:
          AGENT_SANDBOX_CHECK_TESTS: 0
        run: micromamba run -n agent-sandbox scripts/check.sh

  # The unit suites, as shards (tests/shard.sh deals the files out by their time under
  # kcov, tests/shard-times.tsv; within a shard they run in parallel).
  unit:
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    name: unit (${{ matrix.shard }}/4)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: mamba-org/setup-micromamba@v3
        with:
          environment-file: environment.yml
          cache-environment: true
      - name: Unit suites, shard ${{ matrix.shard }}/4
        env:
          AGENT_SANDBOX_TEST_SHARD: ${{ matrix.shard }}/4
        run: micromamba run -n agent-sandbox tests/run.sh unit

  # The real bwrap: what the agent sees, the CA bundle, conda passthrough, the
  # SSH broker, on Ubuntu 22.04, 24.04 and 26.04. Every job that runs bwrap gets
  # bubblewrap 0.12.0 from .github/actions/bwrap: ./install.sh --rebuild-bwrap's package,
  # kept in the Actions cache per release, so a job builds it (about a minute) only when
  # the cache has none. The action also relaxes GitHub's restriction of unprivileged user
  # namespaces on 24.04+ (the installer does the same with an AppArmor profile) and
  # proves a sandbox runs, so a missing namespace fails the job instead of silently
  # skipping the suites.
  integration:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04, ubuntu-26.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install nftables, openssh-server, rsync, passt
        run: |
          sudo apt-get update
          # openssh-server and rsync for the sshd profile's test (#335); installing the
          # server starts the runner's own sshd on port 22, which the test does not use.
          sudo apt-get install -y nftables openssh-server rsync
          # passt is not packaged for Ubuntu 22.04; best-effort so that leg
          # installs the rest and the strict test skips there.
          sudo apt-get install -y passt || echo 'passt unavailable on this runner; strict test will skip'
      - uses: ./.github/actions/bwrap
      - uses: mamba-org/setup-micromamba@v3
        with:
          environment-file: environment.yml
          cache-environment: true
      - name: Integration suites (real bwrap)
        run: micromamba run -n agent-sandbox tests/run.sh integration

  # install.sh for real against the runner's HOME: a fake Claude binary stands
  # in for the agent, a systemctl shim runs the rendered unit's ExecStart, and
  # the installed launcher then drives the fake agent through the installed
  # proxy. Needs bwrap for the launch tests; port 8888 is free on a fresh
  # runner, so the two
  # proxy-dependent tests run here rather than skip. install.sh builds the
  # proxy's environment with the micromamba it fetches, as it does the tools env.
  e2e:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04, ubuntu-26.04]
    runs-on: ${{ matrix.os }}
    env:
      AGENT_SANDBOX_E2E: "1"
    steps:
      - uses: actions/checkout@v4
      # On the distribution's bubblewrap (older than 0.12.0 on every leg today) the dry
      # run prints the rebuild's plan, or says nothing is to rebuild where the release
      # ships 0.12.0 or newer; once the action has run it must say nothing is to rebuild.
      - name: Install the distribution's bubblewrap
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
      - name: --rebuild-bwrap --dry-run on the distribution's bubblewrap
        run: .github/actions/bwrap/bwrap.sh dry-run
      - uses: ./.github/actions/bwrap
      - name: --rebuild-bwrap --dry-run has nothing to rebuild after the action
        run: .github/actions/bwrap/bwrap.sh dry-run after
      - uses: mamba-org/setup-micromamba@v3
        with:
          environment-file: environment.yml
          cache-environment: true
      - name: End-to-end installer test (shim for systemd)
        run: micromamba run -n agent-sandbox tests/run.sh e2e

  # Experiment, allowed to fail: can a GitHub runner provide a real user systemd
  # instance, so install.sh's actual `systemctl --user` path works end to end?
  # Enable lingering, point at the user bus, install for real (a fake Claude
  # binary stands in for the agent), and check the unit comes up and enforces
  # the allowlist. If the runner cannot, this fails visibly without blocking the
  # build; the shimmed e2e job above is the enforced one.
  e2e-real-systemd:
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/bwrap
      - name: Bring up a user systemd instance
        run: |
          sudo loginctl enable-linger "$USER"
          uid=$(id -u)
          echo "XDG_RUNTIME_DIR=/run/user/$uid" >>"$GITHUB_ENV"
          echo "DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/$uid/bus" >>"$GITHUB_ENV"
          for _ in $(seq 1 20); do
            [ -S "/run/user/$uid/bus" ] && break
            sleep 0.5
          done
          XDG_RUNTIME_DIR=/run/user/$uid DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/$uid/bus \
            systemctl --user is-system-running || true
      - name: Install for real with the runner's user systemd
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/share/claude/versions/9.9.9"
          cp tests/helpers/fake-agent.sh "$HOME/.local/share/claude/versions/9.9.9/claude"
          chmod +x "$HOME/.local/share/claude/versions/9.9.9/claude"
          ./install.sh
          systemctl --user is-active --quiet agent-sandbox-mitmproxy.service
          echo "the unit is active under real user systemd"
      - name: The installed proxy enforces the allowlist
        run: |
          set -euo pipefail
          ca="$HOME/.mitmproxy/mitmproxy-ca-cert.pem"
          # The proxy serves sandbox sessions only (#233): ask as one -- a probe session
          # in the base the engine and the addon share, owned by this shell.
          rt="${XDG_RUNTIME_DIR:-/run/user/$(id -u)}"
          [[ -d "$rt" && -w "$rt" ]] || rt=/tmp
          mkdir -p "$rt/agent-sandbox.$(id -u)"
          sess="$(mktemp -d "$rt/agent-sandbox.$(id -u)/session.XXXXXX")"
          printf '%s %s\n' "$$" "$(awk '{print $22}' "/proc/$$/stat")" >"$sess/owner.id"
          echo ciprobe >"$sess/proxy.token"
          : >"$sess/allow.txt"
          px=http://ciprobe:x@127.0.0.1:8888
          # a client with no session token is refused with a challenge
          anon=$(curl -sS --cacert "$ca" --proxy http://127.0.0.1:8888 --max-time 20 \
            -o /dev/null -w '%{http_connect}' https://api.github.com/ 2>/dev/null || true)
          [[ "$anon" == 407 ]] || { echo "a client with no session token got '$anon', not 407" >&2; exit 1; }
          echo "a client with no session token is refused (407)"
          # api.github.com is in the starter allowlist; an agent's own hosts (api.anthropic.com)
          # are its profile's [allow], opened per launch, not globally (#181)
          code=$(curl -sS --cacert "$ca" --proxy "$px" --max-time 20 \
            -o /dev/null -w '%{http_code}' https://api.github.com/ || true)
          # any HTTP status means the request went out through the proxy (GitHub may answer
          # 403 or 429 when it rate-limits a runner); only 000 means it did not
          case "$code" in
            [1-5][0-9][0-9]) echo "allowed host reached through the proxy (HTTP $code)" ;;
            *) echo "unexpected HTTP $code from an allowed host" >&2; exit 1 ;;
          esac
          if curl -sS --cacert "$ca" --proxy "$px" --max-time 20 \
            -o /dev/null https://example.com/ 2>/tmp/blocked.err; then
            echo "a non-allowed host was NOT refused" >&2; exit 1
          fi
          grep -q 403 /tmp/blocked.err && echo "non-allowed host refused at CONNECT (403)"
          rm -rf "$sess"
      - name: Stop the service
        if: always()
        run: systemctl --user stop agent-sandbox-mitmproxy.service || true

  # The gate: the ruleset on main requires this check alone, so its name must not change.
  # Every job that must pass goes in its `needs` (tests/unit/ci-workflow.bats checks that
  # none is missing); coverage is informational and a job with `continue-on-error` is
  # allowed to fail, so neither is listed. `always()` makes it run
  # when a dependency failed -- otherwise it is skipped, and a skipped required check
  # counts as passing -- and it fails unless every dependency's result is `success`.
  ci-ok:
    name: ci-ok
    if: always()
    needs: [check, unit, integration, e2e]
    runs-on: ubuntu-24.04
    steps:
      - name: Every required job succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          bad=$(jq -r 'to_entries[] | select(.value.result != "success") | "\(.key): \(.value.result)"' <<<"$NEEDS")
          if [[ -n "$bad" ]]; then
            printf 'not success:\n%s\n' "$bad" >&2
            exit 1
          fi
          jq -r 'keys | join(", ") | "all success: " + .' <<<"$NEEDS"

  # Line coverage: kcov (engine) + coverage.py (addon, and the components join.py and
  # connect-sync.py), uploaded to Codecov for the README badge. The engine's stages run as
  # shards (COVERAGE_SHARD, tests/shard.sh); each merges its own kcov runs and passes on
  # that merged directory -- a few MB, where the per-launch runs are over a GB -- with its
  # components' coverage.py data in py/, and coverage-merge merges the merges, which gives
  # the same coverage as one merge. kcov is built from source with conda-forge deps (it is not
  # packaged), into an environment cached under its own key so that a later run finds it
  # built. The integration stage needs bwrap/pasta. Needs the CODECOV_TOKEN repo secret;
  # forks (no secret) skip the upload, not the run.
  # engine-unit runs as six shards, where the plain unit job has four: under kcov its
  # tests take about twice as long, and at four shards its jobs took 7-13.7 minutes
  # (#462). Each job also pays a fixed ~45 s (setup, the cached kcov, the merge).
  # A test that fails under kcov fails its shard's job (#462), after the shard has merged
  # and uploaded its coverage: the failed tests go in the job's step summary, and each
  # shard's TAP and timing files in its tests-* artifact. Coverage is not in ci-ok's
  # needs, so a red shard blocks no merge, and coverage-merge runs whatever the shards'
  # results were.
  coverage:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { stage: engine-unit, k: 1, n: 6 }
          - { stage: engine-unit, k: 2, n: 6 }
          - { stage: engine-unit, k: 3, n: 6 }
          - { stage: engine-unit, k: 4, n: 6 }
          - { stage: engine-unit, k: 5, n: 6 }
          - { stage: engine-unit, k: 6, n: 6 }
          - { stage: engine-integration, k: 1, n: 2 }
          - { stage: engine-integration, k: 2, n: 2 }
    name: coverage (${{ matrix.stage }} ${{ matrix.k }}/${{ matrix.n }})
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install nftables, passt
        if: matrix.stage == 'engine-integration'
        run: |
          sudo apt-get update
          sudo apt-get install -y nftables passt
      - uses: ./.github/actions/bwrap
        if: matrix.stage == 'engine-integration'
      - uses: mamba-org/setup-micromamba@v3
        with:
          environment-file: environment.yml
          create-args: cmake make pkg-config cxx-compiler openssl libcurl elfutils zlib
          cache-environment: true
          cache-environment-key: kcov-v1
      - name: Build kcov (already there when the environment came from the cache)
        run: micromamba run -n agent-sandbox scripts/install-kcov.sh
      - name: "Coverage: ${{ matrix.stage }}, shard ${{ matrix.k }}/${{ matrix.n }}"
        id: tests
        # `shell: bash` runs it under `set -o pipefail` too, so a failed test fails the step
        # through the tee; a step with no shell runs `bash -e {0}`, which takes tee's status
        shell: bash
        env:
          COVERAGE_SHARD: ${{ matrix.k }}/${{ matrix.n }}
        run: micromamba run -n agent-sandbox scripts/coverage.sh ${{ matrix.stage }} | tee -a "$GITHUB_STEP_SUMMARY"
      - name: The tests that failed under kcov, in the step summary
        if: ${{ !cancelled() && steps.tests.outcome != 'skipped' }}
        run: micromamba run -n agent-sandbox scripts/coverage.sh failures >>"$GITHUB_STEP_SUMMARY"
      - name: Merge this shard's runs
        if: ${{ !cancelled() && steps.tests.outcome != 'skipped' }}
        run: micromamba run -n agent-sandbox scripts/coverage.sh engine-merge
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && steps.tests.outcome != 'skipped' }}
        with:
          name: cov-${{ matrix.stage }}-${{ matrix.k }}
          path: coverage-out/engine
          retention-days: 1
          if-no-files-found: ignore
      # each test's TAP line (its time, and a failure's output), each file's time
      # (scripts/shard-times.sh makes tests/shard-times.tsv from these) and kcov's own
      # stderr (tests/helpers/kcov-exec.sh)
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && steps.tests.outcome != 'skipped' }}
        with:
          name: tests-${{ matrix.stage }}-${{ matrix.k }}
          path: |
            coverage-out/*.tap
            coverage-out/timing-*.tsv
            coverage-out/engine-runs/*/kcov.log
          retention-days: 14
          if-no-files-found: ignore

  coverage-merge:
    needs: coverage
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: mamba-org/setup-micromamba@v3
        with:
          environment-file: environment.yml
          create-args: cmake make pkg-config cxx-compiler openssl libcurl elfutils zlib
          cache-environment: true
          cache-environment-key: kcov-v1
      - name: Build kcov (already there when the environment came from the cache)
        run: micromamba run -n agent-sandbox scripts/install-kcov.sh
      - uses: actions/download-artifact@v4
        with:
          pattern: cov-*
          path: coverage-out/engine-parts
      - name: "Coverage: merge the shards"
        run: micromamba run -n agent-sandbox scripts/coverage.sh engine-merge | tee -a "$GITHUB_STEP_SUMMARY"
      - name: "Coverage: addon"
        run: micromamba run -n agent-sandbox scripts/coverage.sh addon | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage-out/addon-coverage.xml,coverage-out/engine-cobertura.xml,coverage-out/components-coverage.xml
          fail_ci_if_error: false
