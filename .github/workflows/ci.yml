name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The unit and integration suites, and the coverage stages, run as one pool of tests per
# job (tests/run.sh, scripts/coverage.sh). A GitHub runner has 4 vCPUs; said here rather
# than read from lscpu, whose core count on a runner VM is not a measured thing.
env:
  AGENT_SANDBOX_TEST_JOBS: 4
  COVERAGE_JOBS: 4

jobs:
  # Lint, format, the Python components, install.sh in sync with its sources, the
  # installer's dry run -- scripts/check.sh, which is what a contributor runs locally,
  # without its test suites: CI runs those as the shards below.
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: environment.yml
          cache-environment: true
      - name: scripts/check.sh (lint, shfmt, bundle-sync, dry-run)
        env:
          AGENT_SANDBOX_CHECK_TESTS: 0
        run: micromamba run -n agent-sandbox scripts/check.sh

  # The unit suites, as shards of about a minute each (tests/shard.sh deals the files out
  # by their number of tests; within a shard they run in parallel).
  unit:
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    name: unit (${{ matrix.shard }}/4)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: environment.yml
          cache-environment: true
      - name: Unit suites, shard ${{ matrix.shard }}/4
        env:
          AGENT_SANDBOX_TEST_SHARD: ${{ matrix.shard }}/4
        run: micromamba run -n agent-sandbox tests/run.sh unit

  # The real bwrap: what the agent sees, the CA bundle, conda passthrough, the
  # SSH broker, on Ubuntu 22.04, 24.04 and 26.04. GitHub's kernels restrict unprivileged user namespaces on 24.04+;
  # relax that so bwrap works (the installer does the same with an AppArmor
  # profile), then prove it works so a missing namespace fails the job instead
  # of silently skipping the suites.
  integration:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04, ubuntu-26.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install bubblewrap and enable user namespaces
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap nftables
          # passt is not packaged for Ubuntu 22.04; best-effort so that leg
          # installs the rest and the strict test skips there.
          sudo apt-get install -y passt || echo 'passt unavailable on this runner; strict test will skip'
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          bwrap --ro-bind / / --unshare-user --unshare-pid -- true
          echo "user namespaces work on ${{ matrix.os }}"
      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: environment.yml
          cache-environment: true
      - name: Integration suites (real bwrap)
        run: micromamba run -n agent-sandbox tests/run.sh integration

  # install.sh for real against the runner's HOME: a fake Claude binary stands
  # in for the agent, a systemctl shim runs the rendered unit's ExecStart, and
  # the installed launcher then drives the fake agent through the installed
  # proxy. Needs bwrap for the launch tests; port 8888 is free on a fresh
  # runner, so the two
  # proxy-dependent tests run here rather than skip. install.sh's pip route
  # uses the environment's python (>= 3.12 with venv), provided by micromamba.
  e2e:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04, ubuntu-26.04]
    runs-on: ${{ matrix.os }}
    env:
      AGENT_SANDBOX_E2E: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Install bubblewrap and enable user namespaces
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          bwrap --ro-bind / / --unshare-user --unshare-pid -- true
      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: environment.yml
          cache-environment: true
      - name: End-to-end installer test (shim for systemd)
        run: micromamba run -n agent-sandbox tests/run.sh e2e

  # Experiment, allowed to fail: can a GitHub runner provide a real user systemd
  # instance, so install.sh's actual `systemctl --user` path works end to end?
  # Enable lingering, point at the user bus, install for real (a fake Claude
  # binary stands in for the agent), and check the unit comes up and enforces
  # the allowlist. If the runner cannot, this fails visibly without blocking the
  # build; the shimmed e2e job above is the enforced one.
  e2e-real-systemd:
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install bubblewrap and enable user namespaces
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          bwrap --ro-bind / / --unshare-user --unshare-pid -- true
      - name: Bring up a user systemd instance
        run: |
          sudo loginctl enable-linger "$USER"
          uid=$(id -u)
          echo "XDG_RUNTIME_DIR=/run/user/$uid" >>"$GITHUB_ENV"
          echo "DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/$uid/bus" >>"$GITHUB_ENV"
          for _ in $(seq 1 20); do
            [ -S "/run/user/$uid/bus" ] && break
            sleep 0.5
          done
          XDG_RUNTIME_DIR=/run/user/$uid DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/$uid/bus \
            systemctl --user is-system-running || true
      - name: Install for real with the runner's user systemd
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/share/claude/versions/9.9.9"
          cp tests/helpers/fake-claude.sh "$HOME/.local/share/claude/versions/9.9.9/claude"
          chmod +x "$HOME/.local/share/claude/versions/9.9.9/claude"
          ./install.sh
          systemctl --user is-active --quiet agent-sandbox-mitmproxy.service
          echo "the unit is active under real user systemd"
      - name: The installed proxy enforces the allowlist
        run: |
          set -euo pipefail
          ca="$HOME/.mitmproxy/mitmproxy-ca-cert.pem"
          # api.github.com is in the starter allowlist; an agent's own hosts (api.anthropic.com)
          # are its profile's [allow], opened per launch, not globally (#181)
          code=$(curl -sS --cacert "$ca" --proxy http://127.0.0.1:8888 --max-time 20 \
            -o /dev/null -w '%{http_code}' https://api.github.com/ || true)
          case "$code" in
            200 | 403) echo "allowed host reached through the proxy (HTTP $code)" ;;
            *) echo "unexpected HTTP $code from an allowed host" >&2; exit 1 ;;
          esac
          if curl -sS --cacert "$ca" --proxy http://127.0.0.1:8888 --max-time 20 \
            -o /dev/null https://example.com/ 2>/tmp/blocked.err; then
            echo "a non-allowed host was NOT refused" >&2; exit 1
          fi
          grep -q 403 /tmp/blocked.err && echo "non-allowed host refused at CONNECT (403)"
      - name: Stop the service
        if: always()
        run: systemctl --user stop agent-sandbox-mitmproxy.service || true

  # Line coverage: kcov (engine) + coverage.py (addon), uploaded to Codecov for the README
  # badge. The engine's stages run as shards (COVERAGE_SHARD, tests/shard.sh); each merges
  # its own kcov runs and passes on that merged directory -- a few MB, where the per-launch
  # runs are over a GB -- and coverage-merge merges the merges, which gives the same
  # coverage as one merge. kcov is built from source with conda-forge deps (it is not
  # packaged), into an environment cached under its own key so that a later run finds it
  # built. The integration stage needs bwrap/pasta. Needs the CODECOV_TOKEN repo secret;
  # forks (no secret) skip the upload, not the run.
  coverage:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { stage: engine-unit, k: 1, n: 4 }
          - { stage: engine-unit, k: 2, n: 4 }
          - { stage: engine-unit, k: 3, n: 4 }
          - { stage: engine-unit, k: 4, n: 4 }
          - { stage: engine-integration, k: 1, n: 2 }
          - { stage: engine-integration, k: 2, n: 2 }
    name: coverage (${{ matrix.stage }} ${{ matrix.k }}/${{ matrix.n }})
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install bubblewrap, nftables, passt; enable user namespaces
        if: matrix.stage == 'engine-integration'
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap nftables passt
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          bwrap --ro-bind / / --unshare-user --unshare-pid -- true
      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: environment.yml
          create-args: cmake make pkg-config cxx-compiler openssl libcurl elfutils zlib
          cache-environment: true
          cache-environment-key: kcov-v1
      - name: Build kcov (already there when the environment came from the cache)
        run: micromamba run -n agent-sandbox scripts/install-kcov.sh
      - name: "Coverage: ${{ matrix.stage }}, shard ${{ matrix.k }}/${{ matrix.n }}"
        env:
          COVERAGE_SHARD: ${{ matrix.k }}/${{ matrix.n }}
        run: micromamba run -n agent-sandbox scripts/coverage.sh ${{ matrix.stage }} | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Merge this shard's runs
        run: micromamba run -n agent-sandbox scripts/coverage.sh engine-merge
      - uses: actions/upload-artifact@v4
        with:
          name: cov-${{ matrix.stage }}-${{ matrix.k }}
          path: coverage-out/engine
          retention-days: 1
          if-no-files-found: ignore

  coverage-merge:
    needs: coverage
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: environment.yml
          create-args: cmake make pkg-config cxx-compiler openssl libcurl elfutils zlib
          cache-environment: true
          cache-environment-key: kcov-v1
      - name: Build kcov (already there when the environment came from the cache)
        run: micromamba run -n agent-sandbox scripts/install-kcov.sh
      - uses: actions/download-artifact@v4
        with:
          pattern: cov-*
          path: coverage-out/engine-parts
      - name: "Coverage: merge the shards"
        run: micromamba run -n agent-sandbox scripts/coverage.sh engine-merge | tee -a "$GITHUB_STEP_SUMMARY"
      - name: "Coverage: addon"
        run: micromamba run -n agent-sandbox scripts/coverage.sh addon | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage-out/addon-coverage.xml,coverage-out/engine-cobertura.xml
          fail_ci_if_error: false
